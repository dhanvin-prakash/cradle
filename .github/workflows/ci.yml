name: iOS

on:
  push:
    branches: [main]
    paths-ignore: ["android/**", ".github/workflows/android.yml", ".github/scripts/android-screenshots.sh"]
  pull_request:
    paths-ignore: ["android/**", ".github/workflows/android.yml", ".github/scripts/android-screenshots.sh"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.example.cradle

jobs:
  test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick iPhone simulator
        id: sim
        run: .github/scripts/pick-simulator.sh >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Cradle.xcodeproj \
            -scheme Cradle \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TestResults
          path: TestResults.xcresult

  screenshots:
    name: Screenshots
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick iPhone simulator
        id: sim
        run: .github/scripts/pick-simulator.sh >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cradle.xcodeproj \
            -scheme Cradle \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY=- \
            | xcbeautify --renderer github-actions

      - name: Capture screenshots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p screenshots
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" DerivedData/Build/Products/Debug-iphonesimulator/Cradle.app

          for appearance in light dark; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            for tab in status updates visit careTeam; do
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
              role=parent; [ "$tab" = careTeam ] && role=careTeam
              xcrun simctl launch "$UDID" "$BUNDLE_ID" -initialTab "$tab" -appRole "$role"
              sleep 6
              xcrun simctl io "$UDID" screenshot "screenshots/${appearance}-${tab}.png"
            done
          done
          ls -la screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v6
        with:
          name: Screenshots
          path: screenshots
